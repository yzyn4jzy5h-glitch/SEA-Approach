</aside><div id=s><canvas id=c></canvas><div id=warn style="position:absolute;top:6px;left:6px"></div></div></div></div><script>
document.addEventListener('pointerdown',()=>{try{if(screen.orientation&&screen.orientation.lock)screen.orientation.lock('landscape').catch(()=>{})}catch(e){}},{once:true});
const c=document.querySelector('#c'),x=c.getContext('2d'),S=document.querySelector('#s');let W,H,last=performance.now(),t=0,next=3,traffic='Normal',sel=null,score=1000,n=400,A=[],msgs=[];

new ResizeObserver(()=>requestAnimationFrame(size)).observe(S);function R(){return Math.min(W,H)*.46}function X(q){return W/2+q*R()}function Y(q){return H/2-q*R()}function N(q){return(q%360+360)%360}

function panel(){if(!sel){cs.textContent='NO TARGET';ty.textContent='Tap aircraft';hd.textContent=al.textContent=sp.textContent='---';return}cs.textContent=sel.id;ty.textContent=sel.type+' • '+sel.route+(sel.captured?' • LOC '+sel.rwy:(sel.app?' • ILS '+sel.rwy+' ARMED':''));hd.textContent=Math.round(sel.th)+'°';al.textContent=sel.ta.toLocaleString();sp.textContent=Math.round(sel.ts)}
let pendingH=0,pendingA=2000,pendingS=220;
function wheelHTML(vals,cur,kind){return '<div class=iwpad></div>'+vals.map(v=>'<div class="iwrow '+(v===cur?'sel':'')+'" data-v="'+v+'">'+(kind==='h'?String(v).padStart(3,'0')+'°':kind==='a'?v.toLocaleString()+' FT':v+' KT')+'</div>').join('')+'<div class=iwpad></div>'}
function buildWheels(){let hs=Array.from({length:36},(_,i)=>i*10),as=Array.from({length:14},(_,i)=>2000+i*1000),ss=Array.from({length:21},(_,i)=>120+i*10);hw.innerHTML=wheelHTML(hs,pendingH,'h');aw.innerHTML=wheelHTML(as,pendingA,'a');sw.innerHTML=wheelHTML(ss,pendingS,'s');centerWheel(hw,pendingH);centerWheel(aw,pendingA);centerWheel(sw,pendingS)}
function centerWheel(box,val){setTimeout(()=>{let el=box.querySelector('[data-v="'+val+'"]');if(el)box.scrollTop=el.offsetTop-(box.clientHeight-el.offsetHeight)/2},0)}
function watchWheel(box,kind){let lastIssued=null;function choose(){let r=box.getBoundingClientRect(),cy=r.top+r.height/2,best=null,d0=1e9;box.querySelectorAll('.iwrow').forEach(el=>{let q=el.getBoundingClientRect(),d=Math.abs(q.top+q.height/2-cy);if(d<d0){d0=d;best=el}});if(!best)return;box.querySelectorAll('.iwrow').forEach(e=>e.classList.remove('sel'));best.classList.add('sel');let v=Number(best.dataset.v);if(v===lastIssued)return;lastIssued=v;if(kind==='h'){pendingH=v;if(sel&&sel.th!==v){sel.th=v;log(sel.id+' heading '+String(v).padStart(3,'0')+'°')}}else if(kind==='a'){pendingA=v;if(sel&&sel.ta!==v){sel.ta=v;log(sel.id+' altitude '+v.toLocaleString())}}else{pendingS=v;if(sel&&sel.ts!==v){sel.ts=v;log(sel.id+' speed '+v+' KT')}}panel()}box.addEventListener('scroll',()=>requestAnimationFrame(choose),{passive:true});box.addEventListener('pointerup',choose);box.addEventListener('touchend',choose,{passive:true})}
watchWheel(hw,'h');watchWheel(aw,'a');watchWheel(sw,'s');
function syncPickers(){if(!sel)return;pendingH=(Math.round(sel.th/10)*10)%360;pendingA=Math.max(2000,Math.min(15000,Math.round(sel.ta/1000)*1000));pendingS=Math.max(120,Math.min(320,Math.round(sel.ts/10)*10));buildWheels()}
function assignH(){if(!sel)return log('SELECT A TARGET');sel.th=pendingH;log(sel.id+' heading '+String(sel.th).padStart(3,'0')+'°');panel()}
function assignA(){if(!sel)return log('SELECT A TARGET');sel.ta=pendingA;log(sel.id+' altitude '+sel.ta.toLocaleString());panel()}
buildWheels();
function adj(k,v){if(!sel)return;if(k=='h')sel.th=N(sel.th+v);if(k=='a')sel.ta=Math.max(1000,sel.ta+v);if(k=='s')sel.ts=Math.max(120,sel.ts+v);panel()}
function direct(){if(!sel)return;let f=fx.value,p=F[f];sel.th=N(Math.atan2(p[0]-sel.px,sel.py-p[1])*180/Math.PI);sel.route=f;log(sel.id+' direct '+f);panel()}function app(){if(!sel)return;sel.app=1;sel.captured=0;sel.rwy=rw.value;log(sel.id+' cleared ILS '+sel.rwy+' — intercept required');panel()}
function ga(){if(sel){sel.app=0;sel.captured=0;sel.th=180;sel.ta=3000;sel.ts=190;log(sel.id+' go around');panel()}}
const RWX={'16R':-.05,'16C':0,'16L':.05,'34L':-.05,'34C':0,'34R':.05};
function adiff(a,b){return Math.abs(((a-b+540)%360)-180)}
function approachLogic(a,d){
 if(!a.app||a.captured)return;
 let rx=RWX[a.rwy]??0, south=a.rwy.startsWith('16');
 // Aircraft must be on the approach side of the airport and reasonably aligned.
 let along=south?a.py:-a.py, lateral=Math.abs(a.px-rx), course=south?180:0;
 if(along>.10 && along<.72 && lateral<.07 && adiff(a.h,course)<35){
   a.captured=1;a.th=course;a.ts=Math.min(a.ts,170);log(a.id+' localizer captured '+a.rwy);
 }
}
function capturedLogic(a,d){
 if(!a.captured)return;
 let rx=RWX[a.rwy]??0,south=a.rwy.startsWith('16'),course=south?180:0;
 a.th=course;
 // Gently pull onto centerline and descend on a gameplay glideslope.
 a.px+=(rx-a.px)*Math.min(1,.8*d);
 let dist=Math.abs(a.py),target=Math.max(0,Math.min(3000,dist/.72*3000));
 if(a.a>target)a.ta=target;
 if(dist<.22)a.ts=Math.min(a.ts,150);
 if(dist<.035&&Math.abs(a.px-rx)<.025&&a.a<700){a.done=1;score+=25;log(a.id+' landed '+a.rwy+' +25')}
}
function draw(){x.fillStyle='#040c11';x.fillRect(0,0,W,H);let r=R(),cx=W/2,cy=H/2;x.strokeStyle='#183343';x.lineWidth=1;for(let i=1;i<5;i++){x.beginPath();x.arc(cx,cy,r*i/4,0,7);x.stroke()}for(let i=0;i<8;i++){let q=i*Math.PI/4;x.beginPath();x.moveTo(cx,cy);x.lineTo(cx+Math.sin(q)*r,cy-Math.cos(q)*r);x.stroke()}x.fillStyle='#7894a5';x.fillText('N',cx,cy-r+10);x.fillText('KSEA',cx-12,cy-12);[-.05,0,.05].forEach((q,i)=>{x.strokeStyle='#cbd9e0';x.lineWidth=3;x.beginPath();x.moveTo(X(q),Y(.1));x.lineTo(X(q),Y(-.1));x.stroke();x.fillStyle='#cbd9e0';x.font='7px ui-monospace';let top=['16R','16C','16L'][i],bot=['34L','34C','34R'][i];x.fillText(top,X(q)-7,Y(.1)-5);x.fillText(bot,X(q)-7,Y(-.1)+11)});[-.05,0,.05].forEach(q=>{x.save();x.setLineDash([4,5]);x.strokeStyle='#3f8fb4';x.lineWidth=1;x.beginPath();x.moveTo(X(q),Y(.1));x.lineTo(X(q),Y(.72));x.stroke();x.beginPath();x.moveTo(X(q),Y(-.1));x.lineTo(X(q),Y(-.72));x.stroke();x.restore()});Object.entries(F).forEach(([k,p])=>{x.fillStyle='#5ee68d';x.fillText('△ '+k,X(p[0]),Y(p[1]))});
A.forEach(a=>{let xx=X(a.px),yy=Y(a.py);a.trail.forEach((p,i)=>{x.fillStyle='rgba(101,199,255,'+(.08+i*.045)+')';x.beginPath();x.arc(X(p[0]),Y(p[1]),1.5,0,7);x.fill()});x.save();x.translate(xx,yy);x.rotate(a.h*Math.PI/180);x.fillStyle=a==sel?'#fff':'#bcecff';x.beginPath();x.moveTo(0,-7);x.lineTo(-5,6);x.lineTo(0,3);x.lineTo(5,6);x.fill();x.restore();x.fillStyle='#d7e9f4';x.fillText(a.id,xx+8,yy-9);x.fillText(String(Math.round(a.h)).padStart(3,'0')+'°  '+Math.round(a.a),xx+8,yy+2);x.fillText(Math.round(a.s)+'KT',xx+8,yy+13)});if(sel){x.strokeStyle='#65c7ff';x.beginPath();x.arc(X(sel.px),Y(sel.py),13,0,7);x.stroke()}}
function upd(d){t+=d;next-=d;if(next<=0&&A.length<18)spawn();A.forEach(a=>{approachLogic(a,d);capturedLogic(a,d);let df=((a.th-a.h+540)%360)-180;a.h=N(a.h+Math.sign(df)*Math.min(Math.abs(df),3*d));a.a+=Math.sign(a.ta-a.a)*Math.min(Math.abs(a.ta-a.a),20*d);a.s+=Math.sign(a.ts-a.s)*Math.min(Math.abs(a.ts-a.s),1.25*d);let q=a.h*Math.PI/180,v=a.s/(3600*45)*d*16;a.px+=Math.sin(q)*v;a.py+=Math.cos(q)*v;a.tick+=d;if(a.tick>.25){a.tick=0;a.trail.push([a.px,a.py]);if(a.trail.length>14)a.trail.shift()}});A=A.filter(a=>Math.abs(a.px)<1.2&&Math.abs(a.py)<1.2);let bad=0;for(let i=0;i<A.length;i++)for(let j=i+1;j<A.length;j++)if(Math.hypot(A[i].px-A[j].px,A[i].py-A[j].py)*45<3&&Math.abs(A[i].a-A[j].a)<1000)bad=1;warn.innerHTML=bad?'<span class=bad>⚠ SEPARATION &lt;3 NM</span>':'';if(bad)score-=d*.2;sc.textContent='SCORE '+Math.round(score);tm.textContent=new Date(t*1000).toISOString().slice(14,19);panel()}
