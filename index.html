<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>SEA Approach v1.0 Alpha 5</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020908;color:#8de7c1;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
#rotate{display:none;position:fixed;inset:0;z-index:20;background:#020908;align-items:center;justify-content:center;text-align:center;padding:30px;font-size:18px}
#app{height:100dvh;display:grid;grid-template-columns:145px minmax(0,1fr)}
#controls{border-right:1px solid #24483e;padding:8px 6px;overflow:hidden;background:#04100e}
h1{font-size:10px;margin:0 0 7px;color:#b7ffe1;letter-spacing:.4px}
.label{font-size:8px;color:#639c87;margin:6px 0 3px}
#selected{font-size:10px;line-height:1.35;min-height:40px;padding:5px;border:1px solid #24483e}
.wheel{height:72px;overflow-y:auto;scroll-snap-type:y mandatory;-webkit-overflow-scrolling:touch;border:1px solid #24483e}
.row{height:36px;display:flex;align-items:center;justify-content:center;scroll-snap-align:center;font-size:11px}
.row.active{font-size:14px;color:#fff;background:#0b2a22}
.pad{height:36px}
.note{font-size:7px;color:#527d6d;margin-top:7px;line-height:1.35}
#scopeWrap{position:relative;min-width:0;min-height:0}
canvas{display:block;width:100%;height:100%;touch-action:none}
#range{position:absolute;right:8px;top:7px;font-size:8px;color:#639c87;pointer-events:none}
@media(orientation:portrait){#rotate{display:flex}#app{display:none}}
@media(orientation:landscape) and (max-height:430px){
 #app{grid-template-columns:132px minmax(0,1fr)}
 #controls{padding:5px}
 h1{margin-bottom:4px}
 .label{margin:3px 0 2px}
 #selected{min-height:31px;padding:3px;font-size:8px}
 .wheel{height:54px}
 .row{height:26px;font-size:9px}.row.active{font-size:12px}.pad{height:26px}
 .note{margin-top:4px;font-size:6.5px}
}
</style>
</head>
<body>
<div id="rotate">LANDSCAPE MODE<br><small>Rotate your iPhone sideways to begin SEA Approach.</small></div>
<div id="app">
 <aside id="controls">
  <h1>SEA APPROACH<br>v1.0 • ALPHA 5</h1>
  <div class="label">SELECTED TARGET</div>
  <div id="selected">Tap the aircraft</div>
  <div class="label">HEADING</div><div id="hw" class="wheel"></div>
  <div class="label">ALTITUDE</div><div id="aw" class="wheel"></div>
  <div class="label">SPEED</div><div id="sw" class="wheel"></div>
  <div class="note">SCROLL = SELECT • TAP = COMMAND<br>PINCH TO ZOOM • DRAG TO PAN<br>SIMULATION • NOT FOR OPERATIONAL USE</div>
 </aside>
 <main id="scopeWrap"><canvas id="scope"></canvas><div id="range">KSEA • 50 NM</div></main>
</div>
<script>
const c=document.getElementById('scope'),ctx=c.getContext('2d'),selected=document.getElementById('selected'),hw=document.getElementById('hw'),aw=document.getElementById('aw'),sw=document.getElementById('sw');
let W=0,H=0,DPR=1,last=performance.now(),wheelBusy=false;

// World coordinates are nautical miles: +x east, +y north.
// Camera can pan and zoom; 50 NM is the initial visible width.
const BASE_WORLD_WIDTH=50;
let viewWidth=50,camX=0,camY=0,NM_PER_PX=1;
const MIN_VIEW=12,MAX_VIEW=100;

// KSEA runway geometry: parallel runways, approximately 164.7°/344.7°.
// Lengths are represented in nautical miles from published runway lengths.
const runways=[
 {name:'16R/34L',x:-0.62,len:11901/6076.12},
 {name:'16C/34C',x:0,len:9426/6076.12},
 {name:'16L/34R',x:0.62,len:8500/6076.12}
];
const RWY_HDG=164.7;

const ac={
 call:'ASA421',type:'B739',
 x:-15.5,y:13.5,
 hdg:135,targetHdg:135,
 alt:8000,targetAlt:8000,spd:220,targetSpd:220,
 trail:[],trailClock:0,selected:false
};

function resize(){
 const r=c.getBoundingClientRect();DPR=Math.min(devicePixelRatio||1,2);
 c.width=Math.round(r.width*DPR);c.height=Math.round(r.height*DPR);
 ctx.setTransform(DPR,0,0,DPR,0,0);W=r.width;H=r.height;
 NM_PER_PX=viewWidth/W;
}
new ResizeObserver(resize).observe(c);
addEventListener('orientationchange',()=>setTimeout(resize,100));

function sx(x){return W/2+(x-camX)/NM_PER_PX}
function sy(y){return H/2-(y-camY)/NM_PER_PX}
function norm(a){return (a%360+360)%360}
function diff(a,b){return ((b-a+540)%360)-180}

function drawLineHeading(x,y,hdg,len){
 const r=hdg*Math.PI/180,dx=Math.sin(r)*len/2,dy=Math.cos(r)*len/2;
 ctx.moveTo(sx(x-dx),sy(y-dy));ctx.lineTo(sx(x+dx),sy(y+dy));
}

function draw(){
 ctx.clearRect(0,0,W,H);ctx.fillStyle='#020908';ctx.fillRect(0,0,W,H);
 document.getElementById('range').textContent='KSEA • '+Math.round(viewWidth)+' NM';
 const cx=W/2,cy=H/2;

 // 5 NM range rings centered on KSEA; they move naturally when the scope is panned.
 ctx.strokeStyle='#12372e';ctx.lineWidth=1;
 const airportX=sx(0),airportY=sy(0);
 for(let nm=5;nm<=50;nm+=5){
  const rr=nm/NM_PER_PX;
  if(rr<Math.max(W,H)*1.5){ctx.beginPath();ctx.arc(airportX,airportY,rr,0,Math.PI*2);ctx.stroke()}
 }
 ctx.fillStyle='#376c5a';ctx.font='8px ui-monospace';

 // compass ticks around usable scope
 const rad=Math.min(W,H)*.47;
 ctx.textAlign='center';ctx.textBaseline='middle';
 for(let h=0;h<360;h+=10){
  const a=h*Math.PI/180,major=h%30===0;
  const x1=cx+Math.sin(a)*(rad-(major?8:4)),y1=cy-Math.cos(a)*(rad-(major?8:4));
  const x2=cx+Math.sin(a)*rad,y2=cy-Math.cos(a)*rad;
  ctx.strokeStyle=major?'#4d8973':'#234c3d';ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
  if(major){ctx.fillStyle='#4d8973';ctx.font='7px ui-monospace';ctx.fillText(String(h).padStart(3,'0'),cx+Math.sin(a)*(rad-15),cy-Math.cos(a)*(rad-15))}
 }

 // airport reference
 ctx.strokeStyle='#6dbf9e';ctx.lineWidth=1.2;
 for(const r of runways){ctx.beginPath();drawLineHeading(r.x,0,RWY_HDG,r.len);ctx.stroke()}
 ctx.fillStyle='#79cbaa';ctx.font='7px ui-monospace';ctx.textAlign='left';
 ctx.fillText('KSEA',sx(1.2),sy(-.3));

 // aircraft history
 if(ac.trail.length){
  ctx.fillStyle='#315e4f';
  for(const p of ac.trail){ctx.beginPath();ctx.arc(sx(p.x),sy(p.y),1.2,0,Math.PI*2);ctx.fill()}
 }

 const px=sx(ac.x),py=sy(ac.y);
 ctx.save();ctx.translate(px,py);ctx.rotate(ac.hdg*Math.PI/180);
 ctx.strokeStyle=ac.selected?'#fff':'#9cf4ca';ctx.lineWidth=1.5;
 ctx.beginPath();ctx.moveTo(0,-6);ctx.lineTo(4,5);ctx.lineTo(0,3);ctx.lineTo(-4,5);ctx.closePath();ctx.stroke();ctx.restore();

 ctx.fillStyle=ac.selected?'#fff':'#9cf4ca';ctx.font='9px ui-monospace';ctx.textAlign='left';ctx.textBaseline='top';
 ctx.fillText(ac.call+' '+ac.type,px+8,py-10);
 const trend=ac.targetAlt>ac.alt+50?'↑':ac.targetAlt<ac.alt-50?'↓':'';
 ctx.fillText(String(Math.round(ac.alt/100)).padStart(3,'0')+trend+'  '+Math.round(ac.spd)+'KT',px+8,py+1);
 ctx.fillText(String(Math.round(ac.hdg)).padStart(3,'0')+'°',px+8,py+12);
}

function update(dt){
 // Turn rate: 3°/s at 220 kt, bank-limited approximation via standard-rate cap.
 const turnRate=Math.min(6,2*1091*Math.tan(25*Math.PI/180)/Math.max(ac.spd,120));
 const d=diff(ac.hdg,ac.targetHdg);
 ac.hdg=norm(ac.hdg+Math.sign(d)*Math.min(Math.abs(d),turnRate*dt));

 // Altitude and speed response; commands are set only when a highlighted value is tapped.
 const ad=ac.targetAlt-ac.alt; ac.alt+=Math.sign(ad)*Math.min(Math.abs(ad),75*dt);
 const sd=ac.targetSpd-ac.spd; ac.spd+=Math.sign(sd)*Math.min(Math.abs(sd),2*dt);

 // Exact world movement: knots -> NM/sec. A modest 6x simulation clock makes motion visible on phone.
 const sim=3,dist=ac.spd/3600*dt*sim,r=ac.hdg*Math.PI/180;
 ac.x+=Math.sin(r)*dist;ac.y+=Math.cos(r)*dist;
 ac.trailClock+=dt;
 if(ac.trailClock>.8){ac.trailClock=0;ac.trail.push({x:ac.x,y:ac.y});if(ac.trail.length>12)ac.trail.shift()}
}

function frame(t){const dt=Math.min((t-last)/1000,.05);last=t;update(dt);draw();requestAnimationFrame(frame)}
requestAnimationFrame(frame);

function makeWheel(el,vals,fmt,type){
 el.innerHTML='<div class="pad"></div>'+vals.map(v=>`<div class="row" data-v="${v}">${fmt(v)}</div>`).join('')+'<div class="pad"></div>';el.dataset.type=type;
}
makeWheel(hw,Array.from({length:36},(_,i)=>i*10),v=>String(v).padStart(3,'0')+'°','hdg');
makeWheel(aw,Array.from({length:15},(_,i)=>(i+2)*1000),v=>(v/1000)+',000 FT','alt');
makeWheel(sw,Array.from({length:21},(_,i)=>120+i*10),v=>v+' KT','spd');
function nearest(el){
 const er=el.getBoundingClientRect(),centerY=er.top+er.height/2;
 let best=null,bd=1e9;
 el.querySelectorAll('.row').forEach(r=>{
  const rr=r.getBoundingClientRect(),d=Math.abs((rr.top+rr.bottom)/2-centerY);
  if(d<bd){bd=d;best=r}
 });
 return best;
}
function hi(el){
 const b=nearest(el);
 el.querySelectorAll('.row').forEach(r=>r.classList.toggle('active',r===b));
 return b;
}
function center(el,val){
 let best=null,bd=1e9;
 el.querySelectorAll('.row').forEach(r=>{const d=Math.abs(+r.dataset.v-val);if(d<bd){bd=d;best=r}});
 if(best){
  el.scrollTop=best.offsetTop-(el.clientHeight-best.offsetHeight)/2;
  requestAnimationFrame(()=>hi(el));
 }
}
[hw,aw,sw].forEach(el=>{
 let ticking=false;
 const update=()=>{
  if(ticking)return;
  ticking=true;
  requestAnimationFrame(()=>{hi(el);ticking=false});
 };
 el.addEventListener('scroll',update,{passive:true});
 el.addEventListener('touchmove',update,{passive:true});
 el.addEventListener('touchend',()=>{update();setTimeout(()=>hi(el),80)},{passive:true});
 el.addEventListener('click',e=>{
  if(!ac.selected)return;
  const active=hi(el);
  const row=e.target.closest('.row');
  if(!row||row!==active)return;
  const v=+row.dataset.v;
  if(el.dataset.type==='hdg')ac.targetHdg=v;
  if(el.dataset.type==='alt')ac.targetAlt=v;
  if(el.dataset.type==='spd')ac.targetSpd=v;
 });
});
function syncControls(){center(hw,(Math.round(ac.hdg/10)*10)%360);center(aw,Math.round(ac.alt/1000)*1000);center(sw,Math.round(ac.spd/10)*10)}

// Touch camera: one-finger drag pans the scope; two-finger pinch zooms around the gesture midpoint.
const touches=new Map();
let gestureMoved=false,lastPan=null,lastPinch=null;

function touchPoint(e){
 const r=c.getBoundingClientRect();
 return {x:e.clientX-r.left,y:e.clientY-r.top};
}
function pinchState(){
 const p=[...touches.values()];
 if(p.length<2)return null;
 return {mx:(p[0].x+p[1].x)/2,my:(p[0].y+p[1].y)/2,
         d:Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y)};
}
c.addEventListener('pointerdown',e=>{
 c.setPointerCapture?.(e.pointerId);
 touches.set(e.pointerId,touchPoint(e));
 gestureMoved=false;
 if(touches.size===1)lastPan=touchPoint(e);
 if(touches.size===2)lastPinch=pinchState();
},{passive:true});

c.addEventListener('pointermove',e=>{
 if(!touches.has(e.pointerId))return;
 const old=touches.get(e.pointerId),now=touchPoint(e);
 touches.set(e.pointerId,now);
 if(Math.hypot(now.x-old.x,now.y-old.y)>2)gestureMoved=true;

 if(touches.size===1 && lastPan){
  const dx=now.x-lastPan.x,dy=now.y-lastPan.y;
  camX-=dx*NM_PER_PX;
  camY+=dy*NM_PER_PX;
  lastPan=now;
 } else if(touches.size>=2){
  const cur=pinchState();
  if(cur&&lastPinch&&lastPinch.d>0){
   // Preserve the world point beneath the pinch midpoint while zooming.
   const wx=camX+(cur.mx-W/2)*NM_PER_PX;
   const wy=camY-(cur.my-H/2)*NM_PER_PX;
   viewWidth=Math.max(MIN_VIEW,Math.min(MAX_VIEW,viewWidth*(lastPinch.d/cur.d)));
   NM_PER_PX=viewWidth/W;
   camX=wx-(cur.mx-W/2)*NM_PER_PX;
   camY=wy+(cur.my-H/2)*NM_PER_PX;
  }
  lastPinch=cur;
 }
},{passive:true});

function endPointer(e){
 touches.delete(e.pointerId);
 if(touches.size===0){lastPan=null;lastPinch=null}
 else if(touches.size===1){lastPan=[...touches.values()][0];lastPinch=null}
}
c.addEventListener('pointerup',endPointer,{passive:true});
c.addEventListener('pointercancel',endPointer,{passive:true});

c.addEventListener('pointerdown',e=>{
 if(touches.size>1)return;
 const r=c.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;
 if(Math.hypot(x-sx(ac.x),y-sy(ac.y))<28){
  ac.selected=true;
  selected.innerHTML=`${ac.call}<br>${Math.round(ac.alt)} FT • ${Math.round(ac.spd)} KT<br>HDG ${String(Math.round(ac.hdg)).padStart(3,'0')}°`;
  syncControls();
 }
});
</script>
</body>
</html>
