<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>SEA Approach Control v0.2</title>
<style>
:root{--bg:#06100b;--panel:#0a1710;--grid:#173b25;--green:#9ce6a6;--dim:#67906e;--amber:#ffd36b;--red:#ff8585;--blue:#80c9ff}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--green);font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
#app{height:100dvh;display:flex;flex-direction:column}
header{height:46px;display:flex;align-items:center;justify-content:space-between;padding:0 9px;background:#09150e;border-bottom:1px solid #315b3c;font-size:12px}
header b{letter-spacing:.5px}.status{display:flex;gap:8px;align-items:center}
#radar{position:relative;flex:1;min-height:0}canvas{width:100%;height:100%;display:block;touch-action:none}
#toast{position:absolute;left:10px;top:8px;font-size:11px;text-shadow:0 1px 3px #000;pointer-events:none}
#controls{background:var(--panel);border-top:1px solid #315b3c;padding:7px 7px calc(7px + env(safe-area-inset-bottom))}
.row{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none}.row::-webkit-scrollbar{display:none}
button,select{flex:0 0 auto;background:#12261a;color:var(--green);border:1px solid #3c6e47;border-radius:6px;padding:8px 9px;font:inherit;font-size:11px;min-height:36px}
button:active{background:#24502e}.danger{border-color:#8a4a4a}
#info{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px;font-size:11px}.sub{color:#769a7b}
#settings{display:none;position:absolute;z-index:5;right:7px;top:52px;background:#0b1911;border:1px solid #426c4a;border-radius:8px;padding:9px;width:min(320px,calc(100% - 14px));box-shadow:0 8px 30px #000}
#settings label{display:flex;justify-content:space-between;align-items:center;margin:8px 0;font-size:11px}.wide{width:100%}
.bad{color:var(--red)}.good{color:var(--green)}
</style>
</head>
<body>
<div id="app">
<header><b>KSEA APPROACH • v0.2</b><div class="status"><span id="clock">00:00:00</span><span id="score">SCORE 1000</span><button id="gear">⚙</button></div></header>
<div id="settings">
<label>Runway configuration <select id="rwy"><option value="16">16s — northbound</option><option value="34">34s — southbound</option></select></label>
<label>Traffic <select id="traffic"><option value="light">Light</option><option value="normal" selected>Normal</option><option value="heavy">Heavy</option><option value="rush">Rush hour</option></select></label>
<label>Weather <select id="weather"><option>VMC</option><option>Marginal VMC</option><option>IMC</option></select></label>
<button class="wide" id="new">START / RESET SCENARIO</button>
</div>
<div id="radar"><canvas id="cv"></canvas><div id="toast"></div></div>
<div id="controls">
<div id="info"><span id="sel">Tap a target</span><span class="sub">SIMULATION • NOT FOR OPERATIONAL ATC</span></div>
<div class="row"><button onclick="issue('hdg',180)">HDG 180</button><button onclick="issue('hdg',210)">210</button><button onclick="issue('hdg',240)">240</button><button onclick="issue('hdg',270)">270</button><button onclick="issue('hdg',300)">300</button><button onclick="issue('hdg',330)">330</button></div>
<div class="row" style="margin-top:5px"><button onclick="issue('alt',2000)">2,000</button><button onclick="issue('alt',3000)">3,000</button><button onclick="issue('alt',4000)">4,000</button><button onclick="issue('alt',5000)">5,000</button><button onclick="issue('alt',6000)">6,000</button><button onclick="issue('alt',7000)">7,000</button></div>
<div class="row" style="margin-top:5px"><button onclick="issue('spd',150)">150 KTS</button><button onclick="issue('spd',160)">160</button><button onclick="issue('spd',170)">170</button><button onclick="issue('spd',180)">180</button><button onclick="issue('spd',200)">200</button><select id="fix"><option value="">DIRECT…</option><option>CHINS</option><option>GLASR</option><option>HAWKZ</option><option>JAWBN</option><option>SEA</option></select><button onclick="directFix()">EXECUTE</button><button onclick="issue('app',1)">ILS 16C</button></div>
<div class="row" style="margin-top:5px"><button onclick="togglePause()" id="pause">Ⅱ PAUSE</button><button onclick="issue('go',1)" class="danger">GO-AROUND</button><button onclick="cycleView()">RANGE</button></div>
</div>
<script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d'),rad=document.getElementById('radar');
let W=0,H=0,dpr=1,last=performance.now(),simT=0,score=1000,selected=null,paused=false,range=1,toastT=0;
let config={rwy:16,traffic:'normal',weather:'VMC'};
const FIX={CHINS:[-.66,-.48],GLASR:[.72,-.40],HAWKZ:[.78,.48],JAWBN:[-.70,.44],SEA:[0,0]};
const airlines=[['ASA','B739'],['ASA','B738'],['DAL','A321'],['UAL','B738'],['SWA','B38M'],['AAL','B738'],['HAL','A321'],['ASA','B737']];
const base=[
['ASA452','B739',-.70,-.52,105,7000,210,'CHINS'],['DAL183','A321',.72,-.44,245,6000,200,'GLASR'],
['UAL721','B738',.77,.50,310,5000,190,'HAWKZ'],['ASA611','B739',-.73,.45,35,4000,180,'JAWBN'],
['SWA228','B38M',.05,-.86,175,8000,220,'GLASR'],['AAL509','B738',-.90,.05,80,6000,210,'CHINS'],
['HAL34','A321',.86,.02,275,5000,190,'HAWKZ'],['ASA904','B738',-.22,.87,350,4000,175,'JAWBN']];
let ac=[];
function makeAC(r){let[id,type,x,y,hdg,alt,spd,fix]=r;return{id,type,x,y,hdg,alt,spd,targetHdg:hdg,targetAlt:alt,targetSpd:spd,fix,app:false,go:false,trail:[],landed:false}}
function reset(){
 const mult={light:.7,normal:1,heavy:1.6,rush:2.2}[config.traffic];ac=base.map(makeAC);
 let n=Math.max(8,Math.round(base.length*mult));
 for(let i=8;i<n;i++){const dirs=[[.95,-.7,250],[.9,.75,300],[-.92,-.55,110],[-.9,.7,55],[.05,-.95,175]],d=dirs[i%dirs.length],al=[7000,6000,5000,4000][i%4],sp=[210,200,190,180][i%4],[call,type]=airlines[i%airlines.length];
 ac.push({id:call+(500+i*7),type,x:d[0],y:d[1],hdg:d[2],alt:al,spd:sp,targetHdg:d[2],targetAlt:al,targetSpd:sp,fix:Object.keys(FIX)[i%4],app:false,go:false,trail:[],landed:false})}
 score=1000;selected=null;simT=0;toast('SCENARIO RESET — '+config.traffic.toUpperCase())}
function resize(){dpr=devicePixelRatio||1;W=rad.clientWidth;H=rad.clientHeight;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
function px(v){return W/2+v*(Math.min(W,H)*.44)*range}function py(v){return H/2-v*(Math.min(W,H)*.44)*range}function xy(a){return[px(a.x),py(a.y)]}
function norm(a){return(a%360+360)%360}function turn(cur,t,rate){let d=((t-cur+540)%360)-180;return Math.abs(d)<=rate?t:norm(cur+Math.sign(d)*rate)}
function toast(s,bad=false){document.getElementById('toast').innerHTML='<span class="'+(bad?'bad':'good')+'">'+s+'</span>';toastT=3}
function issue(kind,val){
 if(!selected){toast('SELECT AN AIRCRAFT',true);return}
 if(kind==='hdg')selected.targetHdg=val;if(kind==='alt')selected.targetAlt=val;if(kind==='spd')selected.targetSpd=val;
 if(kind==='app'){selected.targetHdg=config.rwy===16?155:335;selected.targetAlt=2000;selected.targetSpd=150;selected.app=true}
 if(kind==='go'){selected.go=true;selected.app=false;selected.targetHdg=norm((config.rwy===16?335:155)+20);selected.targetAlt=Math.max(selected.alt,3000);selected.targetSpd=190}
 toast(selected.id+' • '+(kind==='hdg'?'HDG '+val:kind==='alt'?'ALT '+val:kind==='spd'?'SPD '+val:kind==='app'?'CLEARED ILS RWY '+config.rwy+'C':'GO-AROUND'))}
function directFix(){const f=document.getElementById('fix').value;if(!selected||!f){toast('SELECT TARGET + FIX',true);return}const p=FIX[f];selected.fix=f;selected.targetHdg=norm(Math.atan2(p[0]-selected.x,selected.y-p[1])*180/Math.PI);toast(selected.id+' DIRECT '+f)}
function togglePause(){paused=!paused;document.getElementById('pause').textContent=paused?'▶ RESUME':'Ⅱ PAUSE'}
function cycleView(){range=range===1?.72:range===.72?1.3:1;toast('RANGE '+(range===1?'NORMAL':range<1?'ZOOM OUT':'ZOOM IN'))}
function draw(){
 ctx.clearRect(0,0,W,H);ctx.fillStyle='#06100b';ctx.fillRect(0,0,W,H);const R=Math.min(W,H)*.44*range,cx=W/2,cy=H/2;
 ctx.strokeStyle='#173b25';ctx.lineWidth=1;for(let q=1;q<=4;q++){ctx.beginPath();ctx.arc(cx,cy,R*q/4,0,Math.PI*2);ctx.stroke()}
 for(let a=0;a<Math.PI*2;a+=Math.PI/4){ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(cx+Math.cos(a)*R,cy+Math.sin(a)*R);ctx.stroke()}
 ctx.fillStyle='#67906e';ctx.font='10px ui-monospace';ctx.fillText('N',cx-3,cy-R-7);ctx.fillText('KSEA',cx-15,cy+4);
 [['16L/34R',-.10],['16C/34C',0],['16R/34L',.10]].forEach(r=>{let x=px(r[1]),y1=py(.11),y2=py(-.11);ctx.strokeStyle='#53675a';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(x,y1);ctx.lineTo(x,y2);ctx.stroke();ctx.fillStyle='#67906e';ctx.font='9px ui-monospace';ctx.fillText(r[0].split('/')[0],x+6,y1+2)});
 ctx.strokeStyle='#2b4c33';ctx.lineWidth=2;ctx.strokeRect(px(-.055),py(.035),Math.min(W,H)*.11*range,Math.min(W,H)*.025*range);
 Object.entries(FIX).forEach(([name,p])=>{const x=px(p[0]),y=py(p[1]);ctx.fillStyle='#67906e';ctx.beginPath();ctx.arc(x,y,3,0,Math.PI*2);ctx.fill();ctx.font='10px ui-monospace';ctx.fillText(name,x+6,y-4)});
 ctx.setLineDash([5,5]);ctx.strokeStyle='#294d32';[['CHINS','GLASR'],['JAWBN','HAWKZ']].forEach(pair=>{let a=FIX[pair[0]],b=FIX[pair[1]];ctx.beginPath();ctx.moveTo(px(a[0]),py(a[1]));ctx.lineTo(px(0),py(0));ctx.lineTo(px(b[0]),py(b[1]));ctx.stroke()});ctx.setLineDash([]);
 const r=config.rwy===16?155:335,rr=r*Math.PI/180;ctx.strokeStyle='#55735b';ctx.setLineDash([4,6]);ctx.beginPath();ctx.moveTo(cx-Math.sin(rr)*R*.62,cy+Math.cos(rr)*R*.62);ctx.lineTo(cx+Math.sin(rr)*R*.62,cy-Math.cos(rr)*R*.62);ctx.stroke();ctx.setLineDash([]);
 ctx.fillStyle='#67906e';ctx.font='9px ui-monospace';ctx.fillText('CHINS FIVE',px(-.58),py(-.57));ctx.fillText('GLASR THREE',px(.58),py(-.49));ctx.fillText('HAWKZ EIGHT',px(.60),py(.57));ctx.fillText('JAWBN SEVEN',px(-.62),py(.54));
 ac.forEach(a=>{if(a.landed)return;a.trail.forEach((p,i)=>{ctx.fillStyle='rgba(156,230,166,'+(i/a.trail.length*.18)+')';ctx.fillRect(p[0]-1,p[1]-1,2,2)});let[x,y]=xy(a),ang=(a.hdg-90)*Math.PI/180;ctx.save();ctx.translate(x,y);ctx.rotate(ang);ctx.fillStyle=a===selected?'#fff':a.go?'#ffd36b':'#9ce6a6';ctx.beginPath();ctx.moveTo(9,0);ctx.lineTo(-7,-5);ctx.lineTo(-4,0);ctx.lineTo(-7,5);ctx.closePath();ctx.fill();ctx.restore();ctx.fillStyle=a===selected?'#fff':'#9ce6a6';ctx.font='10px ui-monospace';ctx.fillText(a.id,x+10,y-10);ctx.fillText(String(Math.round(a.alt/100)).padStart(3,'0')+' '+Math.round(a.spd),x+10,y+2);if(a.app){ctx.fillStyle='#80c9ff';ctx.fillText('APP',x+10,y+14)}})
 if(selected){let[x,y]=xy(selected);ctx.strokeStyle='#fff';ctx.beginPath();ctx.arc(x,y,18,0,Math.PI*2);ctx.stroke()}
}
function update(dt){
 if(paused)return;simT+=dt;
 ac.forEach(a=>{if(a.landed)return;a.hdg=turn(a.hdg,a.targetHdg,28*dt);a.alt+=Math.sign(a.targetAlt-a.alt)*Math.min(Math.abs(a.targetAlt-a.alt),900*dt);a.spd+=Math.sign(a.targetSpd-a.spd)*Math.min(Math.abs(a.targetSpd-a.spd),10*dt);let rad=a.hdg*Math.PI/180,v=(a.spd/4200)*dt;a.x+=Math.sin(rad)*v;a.y-=Math.cos(rad)*v;a.trail.push(xy(a));if(a.trail.length>42)a.trail.shift();
 const onFinal=Math.abs(((a.hdg-(config.rwy===16?155:335)+540)%360)-180)<12,near=Math.hypot(a.x,a.y)<.20;if(a.app&&onFinal&&near&&a.alt<=2200){a.targetAlt=800;a.targetSpd=135}if(a.app&&Math.hypot(a.x,a.y)<.035&&a.alt<1200){a.landed=true;score+=35;toast(a.id+' LANDED • +35')}})
 for(let i=0;i<ac.length;i++)for(let j=i+1;j<ac.length;j++){let A=ac[i],B=ac[j];if(A.landed||B.landed)continue;let dist=Math.hypot(A.x-B.x,A.y-B.y)*7.2,ad=Math.abs(A.alt-B.alt);if(dist<3&&ad<1000){score=Math.max(0,score-1);toast('SEPARATION ALERT • '+A.id+' / '+B.id,true)}}
 document.getElementById('score').textContent='SCORE '+String(score).padStart(4,'0');document.getElementById('clock').textContent=new Date(simT*1000).toISOString().slice(11,19);if(toastT>0){toastT-=dt;if(toastT<=0)document.getElementById('toast').innerHTML=''}
}
cv.addEventListener('pointerdown',e=>{let r=cv.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top;selected=null;let best=24;ac.forEach(a=>{if(a.landed)return;let[x,y]=xy(a),d=Math.hypot(mx-x,my-y);if(d<best){best=d;selected=a}});document.getElementById('sel').textContent=selected?selected.id+' • '+selected.type+' • '+Math.round(selected.alt/100)*100+' FT • '+Math.round(selected.spd)+' KT':'Tap a target'});
document.getElementById('gear').onclick=()=>{let s=document.getElementById('settings');s.style.display=s.style.display==='block'?'none':'block'};
document.getElementById('new').onclick=()=>{config.rwy=+document.getElementById('rwy').value;config.traffic=document.getElementById('traffic').value;config.weather=document.getElementById('weather').value;document.getElementById('settings').style.display='none';reset()};
reset();function loop(t){let dt=Math.min(.05,(t-last)/1000);last=t;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script>
</body></html>
